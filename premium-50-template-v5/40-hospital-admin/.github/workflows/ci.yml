name: CI
on: [push,pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run check
      - run: npm test

  web:
    strategy:
      matrix:
        surface: [public-website, user-web-app, admin-website, admin-web-app]
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ${{ matrix.surface }}}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run build
